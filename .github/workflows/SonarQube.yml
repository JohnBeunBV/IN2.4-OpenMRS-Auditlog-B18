name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout (volledige git-history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven # cacht ~/.m2 automatisch
      - name: Cache SonarCloud scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Strip BOM uit Java-bestanden
        run: find . -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;
      - name: Build & SonarCloud analyse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify \
            -Dmaven.compiler.release=8 \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=JohnBeunBV_IN2.4-OpenMRS-Auditlog-B18 \
            -Dsonar.organization=johnbeunbv \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
