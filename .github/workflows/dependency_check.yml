name: "CVE-scan – OWASP Dependency Check"

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 5 * * 1" # elke maandag ~06:00 NL tijd

jobs:
  dependency-check:
    name: OWASP CVE-scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write # SARIF uploaden naar Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      # ------------------------------------------------------------------ #
      # OWASP Dependency Check                                              #
      #                                                                     #
      # Geen cache voor de H2-database — de gecachede DB raakte corrupt    #
      # door een race condition in H2's achtergrondschrijver. Elke run     #
      # krijgt nu een verse database in /tmp.                              #
      #                                                                     #
      # -DfailBuildOnCVSS=7  → faalt bij HIGH/CRITICAL (score ≥ 7)        #
      # -Dformats=HTML,SARIF → leesbaar rapport + GitHub Security upload   #
      # NVD_API_KEY           → optioneel, sneller maar niet verplicht     #
      # ------------------------------------------------------------------ #
      - name: Run OWASP Dependency Check
        working-directory: openmrs-module-auditlog
        run: |
          NVD_KEY="${{ secrets.NVD_API_KEY }}"
          NVD_ARG=""
          if [ -n "$NVD_KEY" ]; then
            NVD_ARG="-DnvdApiKey=$NVD_KEY"
          fi

          mvn -B org.owasp:dependency-check-maven:aggregate \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,SARIF \
            -DdataDirectory=/tmp/owasp-dc-data \
            $NVD_ARG

      - name: Upload HTML-rapport als artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-rapport
          path: openmrs-module-auditlog/target/dependency-check-report.html
          retention-days: 30

      # ------------------------------------------------------------------ #
      # v3 → v4 (v3 wordt december 2026 deprecated)                        #
      # continue-on-error zodat de workflow niet rood wordt als het SARIF  #
      # bestand ontbreekt (bijv. bij een vroegtijdige fout)                #
      # ------------------------------------------------------------------ #
      - name: Upload SARIF naar GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: openmrs-module-auditlog/target/dependency-check-report.sarif
