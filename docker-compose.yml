version: "3.9"

services:
 
  openmrs:
    image: tomcat:7-jre7
    container_name: auditlog-openmrs
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - openmrs-data:/root/.OpenMRS
      - ./openmrs.war:/usr/local/tomcat/webapps/openmrs.war
      - ./omod/target/auditlog-1.1-SNAPSHOT.omod:/root/.OpenMRS/modules/auditlog.omod:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auditlog-net
 
  db:
    image: mysql:5.7
    container_name: auditlog-db
    restart: unless-stopped
    command: >
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --lower_case_table_names=1
      --sql_mode=""
      --wait_timeout=28800
      --interactive_timeout=28800
      --max_allowed_packet=64M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysql"
        - "-h"
        - "127.0.0.1"
        - "-u"
        - "${DB_USER}"
        - "-p${DB_PASSWORD}"
        - "-e"
        - "SELECT 1 FROM information_schema.tables LIMIT 1;"
        - "${DB_NAME}"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - auditlog-net
 
volumes:
  openmrs-data:
  db-data:
 
networks:
  auditlog-net:
    driver: bridge