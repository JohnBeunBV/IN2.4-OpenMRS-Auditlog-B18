# Basis – gedeeld door alle omgevingen
# Module: openmrs-module-auditlog v1.1
# Gebruik:
#   dev  → docker compose --env-file ../config/dev/.env up -d
#   test → docker compose --env-file ../config/test/.env -f docker-compose.yml -f docker-compose.test.yml up -d
#   prod → docker compose --env-file ../config/prod/.env -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:

  openmrs:
    image: openmrs/openmrs-reference-application-distro:2.12.2
    container_name: auditlog-openmrs
    restart: unless-stopped
    volumes:
      - openmrs-data:/openmrs/data
      - ../build/auditlog.omod:/openmrs/distribution/openmrs_modules/auditlog.omod:ro
    environment:
      OMRS_DB_HOST: db
      OMRS_DB_PORT: 3306
      OMRS_DB_NAME: ${DB_NAME}
      OMRS_DB_USERNAME: ${DB_USER}
      OMRS_DB_PASSWORD: ${DB_PASSWORD}
      OMRS_JAVA_SERVER_OPTS: >-
        -Dfile.encoding=UTF-8
        -server
        -Xms512m -Xmx1024m
      OMRS_LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auditlog-net

  db:
    image: mysql:8.0.43
    container_name: auditlog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - auditlog-net

volumes:
  openmrs-data:
  db-data:

networks:
  auditlog-net:
    driver: bridge
