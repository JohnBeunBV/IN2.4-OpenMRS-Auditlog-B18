version: "3.9"

services:

  openmrs:
    restart: always
    expose:
      - "8080" 
    environment:
      OMRS_JAVA_SERVER_OPTS: >-
        -Dfile.encoding=UTF-8
        -server
        -Xms1g -Xmx2g
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  db:
    restart: always
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27.4-alpine
    container_name: auditlog-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - openmrs
    networks:
      - auditlog-net
    security_opt:
      - no-new-privileges:true
